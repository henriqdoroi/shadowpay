<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7C3AED" />
    <title>ShadowPay — sem conexão</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0613;
        color: #f5f3ff;
        text-align: center;
      }
      .box { max-width: 340px; }
      img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 18px 40px -16px rgba(124, 58, 237, 0.7); }
      h1 { margin: 22px 0 6px; font-size: 21px; }
      p { margin: 0; font-size: 14.5px; line-height: 1.5; color: #c4b5fd; }
      button {
        margin-top: 22px;
        height: 46px;
        padding: 0 26px;
        border: 0;
        border-radius: 14px;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        background: linear-gradient(120deg, #7c3aed, #6d28d9);
        box-shadow: 0 10px 24px -10px rgba(124, 58, 237, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/pwa/icon-192.png" alt="ShadowPay" />
      <h1>Sem conexão</h1>
      <p>Seu aparelho está sem internet. Assim que a conexão voltar, a ShadowPay abre normalmente.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </div>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
